name: Keep-alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            https://appforge-studios.vercel.app/api/health | grep -q '"ok":true'
