name: AppForge Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "feat/*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # Job 1: Linting and Code Integrity Verification
  lint-and-typecheck:
    name: Code Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Compiler Verification
        run: npx tsc --noEmit

      - name: ESLint Code Quality Scan
        run: npm run lint

  # Job 2: Real Database Cross-Tenant Test Suite
  test-suite:
    name: Cross-Tenant Real Database Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest Suite (Real Database Queries)
        env:
          NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.TEST_SUPABASE_URL || secrets.NEXT_PUBLIC_INSFORGE_URL }}
          NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: npm test

  # Job 3: Build Verification & Dockerization
  build-and-containerize:
    name: Docker Multi-Stage Build
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Compilation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: appforge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Explicitly test if the sealed standalone container can boot cleanly
      - name: Container Boot Test
        run: |
          docker run -d --name appforge-test -p 3000:3000 appforge:latest
          sleep 10
          docker ps | grep appforge-test
